<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
  --bg:         #f5f5f7;
  --surface:    #ffffff;
  --surface2:   #efefef;
  --border:     #e0e0e3;
  --fg:         #111117;
  --fg2:        #5a5a6e;
  --fg3:        #8888a0;
  --accent:     #5542e8;
  --accent-dim: rgba(85,66,232,0.10);
  --user-bg:    #5542e8;
  --user-fg:    #ffffff;
  --tool-bg:    #f0eeff;
  --tool-border:#c9c1f9;
  --tool-fg:    #3b2fc7;
  --code-bg:    #1e1c2e;
  --code-fg:    #c8c3f6;
  --weather-c:  #0ea5b8;
  --calc-c:     #e88030;
  --search-c:   #2ea05a;
  --dot:        #ccccd8;
  --sidebar-w:  240px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:         #0d0c14;
    --surface:    #17151f;
    --surface2:   #201e2b;
    --border:     #2c2a3a;
    --fg:         #e8e6f4;
    --fg2:        #9490b8;
    --fg3:        #5d5a7a;
    --accent:     #7b6bf0;
    --accent-dim: rgba(123,107,240,0.14);
    --user-bg:    #6355ee;
    --user-fg:    #ffffff;
    --tool-bg:    #1e1c2e;
    --tool-border:#3a3360;
    --tool-fg:    #a89cf5;
    --code-bg:    #111020;
    --code-fg:    #c8c3f6;
    --weather-c:  #22c9e0;
    --calc-c:     #f0a050;
    --search-c:   #40c870;
    --dot:        #3a3850;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px; line-height: 1.55;
}

/* ── Layout ── */
#shell {
  display: flex; height: 100%;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 0.22s ease, opacity 0.22s ease;
  overflow: hidden;
}
#sidebar.collapsed { width: 0; opacity: 0; pointer-events: none; }
.sidebar-header {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
}
.sidebar-title {
  font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3);
}
#new-chat-btn {
  width: 100%; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--accent-dim);
  color: var(--accent); font-family: 'Sora', sans-serif; font-size: 12px;
  font-weight: 600; cursor: pointer; letter-spacing: 0.02em;
  transition: background 0.15s;
}
#new-chat-btn:hover { background: var(--accent); color: #fff; }
#history-list {
  flex: 1; overflow-y: auto; padding: 8px 8px;
  display: flex; flex-direction: column; gap: 2px;
}
.hist-item {
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.12s, border-color 0.12s;
  display: flex; flex-direction: column; gap: 2px; overflow: hidden;
}
.hist-item:hover { background: var(--surface2); border-color: var(--border); }
.hist-item.active { background: var(--accent-dim); border-color: var(--accent); }
.hist-item-row { display: flex; align-items: center; gap: 4px; }
.hist-item-title {
  font-size: 12px; font-weight: 500; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.hist-del-btn {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 4px; border: none;
  background: transparent; color: var(--fg3); cursor: pointer;
  display: none; align-items: center; justify-content: center; padding: 0;
  transition: background 0.12s, color 0.12s;
}
.hist-item:hover .hist-del-btn { display: flex; }
.hist-del-btn:hover { background: rgba(192,57,43,0.14); color: #c0392b; }
.hist-del-btn svg { width: 10px; height: 10px; }
.hist-item-meta {
  font-size: 11px; color: var(--fg3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hist-empty {
  padding: 20px 10px; text-align: center;
  font-size: 12px; color: var(--fg3); line-height: 1.6;
}

/* ── Chat area ── */
#chat-area {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; gap: 10px;
}
.header-left { display: flex; align-items: center; gap: 10px; }
#sidebar-toggle {
  width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--fg2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}
#sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }
#sidebar-toggle svg { width: 14px; height: 14px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.logo-mark svg { width: 18px; height: 18px; fill: #fff; }
.header-title { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.header-sub { font-size: 12px; color: var(--fg3); margin-top: 1px; }
.tool-pills { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.model-select-wrap { position: relative; display: flex; align-items: center; }
#model-select {
  appearance: none; -webkit-appearance: none;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--fg2); font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 0.02em; padding: 5px 26px 5px 9px; cursor: pointer; outline: none;
  transition: border-color 0.15s, color 0.15s;
}
#model-select:hover, #model-select:focus { border-color: var(--accent); color: var(--accent); }
.model-chevron { position: absolute; right: 7px; pointer-events: none; color: var(--fg3); }
.model-chevron svg { width: 10px; height: 10px; }
.tool-pill {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
  font-family: 'Sora', sans-serif; letter-spacing: 0.02em; border: 1px solid;
}
.tool-pill.weather { color: var(--weather-c); border-color: var(--weather-c); background: rgba(14,165,184,0.06); }
.tool-pill.calc    { color: var(--calc-c);    border-color: var(--calc-c);    background: rgba(232,128,48,0.06); }
.tool-pill.search  { color: var(--search-c);  border-color: var(--search-c);  background: rgba(46,160,90,0.06); }
#messages {
  flex: 1; overflow-y: auto; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
}
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.avatar {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700; margin-top: 2px;
}
.avatar.agent { background: var(--accent-dim); color: var(--accent); }
.avatar.user  { background: var(--user-bg); color: var(--user-fg); }
.msg-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 82%; }
.msg-row.user .msg-body { align-items: flex-end; }
.bubble { padding: 11px 14px; border-radius: 14px; word-break: break-word; }
.agent .bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; }
.user  .bubble { background: var(--user-bg); color: var(--user-fg); border-top-right-radius: 4px; }
/* markdown inside agent bubbles */
.agent .bubble h1,.agent .bubble h2,.agent .bubble h3 {
  font-family:'Sora',sans-serif; font-weight:700; letter-spacing:-0.01em;
  margin:0.8em 0 0.3em; line-height:1.25;
}
.agent .bubble h1{font-size:1.15em}.agent .bubble h2{font-size:1.05em}.agent .bubble h3{font-size:0.97em}
.agent .bubble p { margin:0.4em 0; }
.agent .bubble p:first-child { margin-top:0; }
.agent .bubble p:last-child  { margin-bottom:0; }
.agent .bubble ul,.agent .bubble ol { margin:0.4em 0; padding-left:1.4em; }
.agent .bubble li { margin:0.2em 0; }
.agent .bubble strong { font-weight:600; }
.agent .bubble em { font-style:italic; }
.agent .bubble code {
  font-family:'JetBrains Mono',monospace; font-size:0.85em;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:4px; padding:1px 5px;
}
.agent .bubble pre {
  background:var(--code-bg); color:var(--code-fg); border-radius:8px;
  padding:10px 12px; overflow-x:auto; margin:0.5em 0;
}
.agent .bubble pre code { background:none; border:none; padding:0; font-size:0.88em; }
.agent .bubble blockquote {
  border-left:3px solid var(--accent); margin:0.5em 0;
  padding:4px 10px; color:var(--fg2);
}
.agent .bubble a { color:var(--accent); text-decoration:underline; }
.tool-card {
  background: var(--tool-bg); border: 1px solid var(--tool-border);
  border-radius: 10px; padding: 10px 13px; font-size: 13px; width: 100%;
}
.tool-card-header { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.tool-icon {
  width: 20px; height: 20px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tool-icon.get_weather { background: rgba(14,165,184,0.14); color: var(--weather-c); }
.tool-icon.calculator  { background: rgba(232,128,48,0.14);  color: var(--calc-c); }
.tool-icon.web_search  { background: rgba(46,160,90,0.14);   color: var(--search-c); }
.tool-name { font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tool-fg); }
.tool-input { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 4px 7px; background: var(--code-bg); color: var(--code-fg); border-radius: 5px; overflow-x: auto; white-space: pre; margin-bottom: 6px; }
.tool-output { font-size: 13px; white-space: pre-line; line-height: 1.5; }
.tool-divider { height: 1px; background: var(--tool-border); margin: 7px 0; opacity: 0.5; }
.typing-dots {
  display: flex; gap: 4px; align-items: center;
  padding: 13px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; border-top-left-radius: 4px; width: fit-content;
}
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
  animation: bounce 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.18s; }
.typing-dots span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }
#input-bar {
  display: flex; align-items: flex-end; gap: 10px;
  padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
}
#user-input {
  flex: 1; min-width: 0; resize: none;
  border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px;
  background: var(--bg); color: var(--fg); outline: none;
  max-height: 140px; overflow-y: auto; transition: border-color 0.15s;
}
#user-input:focus { border-color: var(--accent); }
#user-input::placeholder { color: var(--fg3); }
#send-btn {
  width: 40px; height: 40px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.15s;
}
#send-btn:hover { opacity: 0.88; }
#send-btn svg { width: 16px; height: 16px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 20px 12px; }
.sug-btn {
  padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); color: var(--fg2); font-size: 13px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s; font-family: 'DM Sans', sans-serif;
}
.sug-btn:hover { border-color: var(--accent); color: var(--accent); }
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: 60px 20px; gap: 12px; flex: 1;
}
.empty-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; }
.empty-icon svg { width: 26px; height: 26px; fill: var(--accent); }
.empty-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.empty-sub { font-size: 14px; color: var(--fg2); max-width: 320px; line-height: 1.5; }
.error-msg { color: #c0392b; font-size: 13px; padding: 8px 12px; background: #fdecea; border-radius: 8px; }
@media (max-width: 600px) {
  #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 100; width: var(--sidebar-w); }
  #sidebar.collapsed { width: 0; }
  header { flex-wrap: wrap; gap: 8px; }
  .msg-body { max-width: 94%; }
}
</style>
</head>
<body>
<div id="shell">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Conversations</div>
      <button id="new-chat-btn">+ New Chat</button>
    </div>
    <div id="history-list"></div>
  </aside>

  <!-- Main chat -->
  <div id="chat-area">
    <header>
      <div class="header-left">
        <button id="sidebar-toggle" aria-label="Toggle history">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="1" y1="3.5" x2="13" y2="3.5"/>
            <line x1="1" y1="7"   x2="13" y2="7"/>
            <line x1="1" y1="10.5" x2="13" y2="10.5"/>
          </svg>
        </button>
        <div class="logo-mark">
          <svg viewBox="0 0 20 20"><path d="M10 2C5.6 2 2 5.6 2 10s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8zm-1 12.4L5.6 10l1.4-1.4 2 2 5-5 1.4 1.4z"/></svg>
        </div>
        <div>
          <div class="header-title">Agent Chat</div>
          <div class="header-sub" id="header-sub">claude-sonnet-4-6 · live mode</div>
        </div>
      </div>
      <div class="tool-pills">
        <div class="model-select-wrap">
          <select id="model-select" aria-label="Select model">
            <option value="claude-sonnet-4-6">Sonnet 4.6</option>
            <option value="claude-haiku-4-5">Haiku 4.5</option>
            <option value="claude-sonnet-5-5">Sonnet 5.5</option>
            <option value="claude-opus-5-5">Opus 5.5</option>
          </select>
          <span class="model-chevron"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5l3 3 3-3"/></svg></span>
        </div>
        <div class="tool-pill weather">Weather</div>
        <div class="tool-pill calc">Calculator</div>
        <div class="tool-pill search">Web Search</div>
      </div>
    </header>

    <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        </div>
        <div class="empty-title">Ask me anything</div>
        <div class="empty-sub">Weather, maths, or web search — Claude picks the right tool automatically.</div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="sug-btn" data-q="What is the weather in Mumbai right now?">Weather in Mumbai</button>
      <button class="sug-btn" data-q="What is 15% of 85000?">15% of 85,000</button>
      <button class="sug-btn" data-q="Is it warmer in Dubai or Singapore today?">Dubai vs Singapore</button>
      <button class="sug-btn" data-q="What is the square root of 1764?">√1764</button>
      <button class="sug-btn" data-q="Search for the latest news on AI agents">Latest AI news</button>
    </div>

    <div id="input-bar">
      <textarea id="user-input" rows="1" placeholder="Ask about weather, maths, or anything…"></textarea>
      <button id="send-btn" aria-label="Send">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M14.7 7.3l-12-6a.75.75 0 00-1 .95l2.44 5.25-2.44 5.25a.75.75 0 001 .95l12-6a.75.75 0 000-1.4z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── Storage helpers ──────────────────────────────────────────────
const STORAGE_KEY = 'agent_chat_history';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveHistory(history) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }
  catch {}
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ── State ────────────────────────────────────────────────────────
let history = loadHistory();   // [{id, title, model, ts, messages:[{role,text?,parts?}]}]
let currentId = null;          // id of the active conversation, null = unsaved new chat

// ── DOM refs ─────────────────────────────────────────────────────
const messagesEl   = document.getElementById('messages');
const inputEl      = document.getElementById('user-input');
const sendBtn      = document.getElementById('send-btn');
const modelSelect  = document.getElementById('model-select');
const headerSub    = document.getElementById('header-sub');
const historyList  = document.getElementById('history-list');
const newChatBtn   = document.getElementById('new-chat-btn');
const sidebarEl    = document.getElementById('sidebar');
const sidebarToggle= document.getElementById('sidebar-toggle');

// ── Sidebar toggle ───────────────────────────────────────────────
sidebarToggle.addEventListener('click', () => {
  sidebarEl.classList.toggle('collapsed');
});

// ── Model selector ───────────────────────────────────────────────
modelSelect.addEventListener('change', () => {
  headerSub.textContent = `${modelSelect.value} · live mode`;
});

// ── Render history sidebar ───────────────────────────────────────
function renderHistory() {
  historyList.innerHTML = '';
  if (!history.length) {
    historyList.innerHTML = '<div class="hist-empty">No saved conversations yet.<br>Start chatting to save one.</div>';
    return;
  }
  // newest first
  [...history].reverse().forEach(conv => {
    const item = document.createElement('div');
    item.className = 'hist-item' + (conv.id === currentId ? ' active' : '');
    item.dataset.id = conv.id;
    const date = new Date(conv.ts);
    const dateStr = date.toLocaleDateString(undefined, { month:'short', day:'numeric' })
                  + ' ' + date.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
    item.innerHTML = `
      <div class="hist-item-row">
        <div class="hist-item-title">${escHtml(conv.title)}</div>
        <button class="hist-del-btn" aria-label="Delete conversation" title="Delete">
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/>
          </svg>
        </button>
      </div>
      <div class="hist-item-meta">${escHtml(conv.model.replace('claude-','').replace('-',' '))} · ${dateStr}</div>`;
    item.querySelector('.hist-del-btn').addEventListener('click', e => {
      e.stopPropagation();
      deleteConversation(conv.id);
    });
    item.addEventListener('click', () => loadConversation(conv.id));
    historyList.appendChild(item);
  });
}

// ── Delete a conversation ────────────────────────────────────────
function deleteConversation(id) {
  history = history.filter(c => c.id !== id);
  saveHistory(history);
  if (currentId === id) {
    // deleted the active chat — show empty state
    currentId = null;
    firstMsgInConv = true;
    messagesEl.innerHTML = `
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        </div>
        <div class="empty-title">Ask me anything</div>
        <div class="empty-sub">Weather, maths, or web search — Claude picks the right tool automatically.</div>
      </div>`;
    document.getElementById('suggestions').style.display = '';
  }
  renderHistory();
}

// ── Save current conversation ────────────────────────────────────
function saveCurrentConversation(firstUserMsg, model) {
  if (currentId) {
    // update existing
    const idx = history.findIndex(c => c.id === currentId);
    if (idx !== -1) {
      history[idx].messages = collectMessages();
      history[idx].model = model;
      saveHistory(history);
      renderHistory();
      return;
    }
  }
  // create new
  currentId = genId();
  const conv = {
    id: currentId,
    title: firstUserMsg.slice(0, 60),
    model,
    ts: Date.now(),
    messages: collectMessages(),
  };
  history.push(conv);
  saveHistory(history);
  renderHistory();
}

// ── Collect rendered messages from DOM ───────────────────────────
function collectMessages() {
  const rows = messagesEl.querySelectorAll('.msg-row');
  const msgs = [];
  rows.forEach(row => {
    if (row.id === 'typing') return;
    if (row.classList.contains('user')) {
      const bubble = row.querySelector('.bubble');
      if (bubble) msgs.push({ role: 'user', text: bubble.textContent });
    } else {
      // agent: collect bubbles and tool cards
      const parts = [];
      row.querySelectorAll('.bubble').forEach(b => parts.push({ type: 'text', text: b.dataset.raw || b.textContent }));
      row.querySelectorAll('.tool-card').forEach(card => {
        const tool  = card.querySelector('.tool-name')?.textContent || '';
        const input = card.querySelector('.tool-input')?.textContent || '';
        const output= card.querySelector('.tool-output')?.textContent || '';
        parts.push({ type: 'tool', tool, input, output });
      });
      if (parts.length) msgs.push({ role: 'agent', parts });
    }
  });
  return msgs;
}

// ── Load a past conversation into the UI ─────────────────────────
function loadConversation(id) {
  const conv = history.find(c => c.id === id);
  if (!conv) return;
  currentId = id;

  // clear chat area
  messagesEl.innerHTML = '';
  document.getElementById('suggestions').style.display = 'none';

  // restore model
  modelSelect.value = conv.model;
  headerSub.textContent = `${conv.model} · live mode`;

  // replay messages
  conv.messages.forEach(msg => {
    if (msg.role === 'user') {
      appendUserBubble(msg.text);
    } else {
      appendAgentParts(msg.parts || []);
    }
  });

  renderHistory();
  scrollBottom();
}

// ── New chat ─────────────────────────────────────────────────────
newChatBtn.addEventListener('click', () => {
  currentId = null;
  messagesEl.innerHTML = `
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      </div>
      <div class="empty-title">Ask me anything</div>
      <div class="empty-sub">Weather, maths, or web search — Claude picks the right tool automatically.</div>
    </div>`;
  document.getElementById('suggestions').style.display = '';
  renderHistory();
});

// ── UI helpers ───────────────────────────────────────────────────
function hideEmpty() {
  const e = document.getElementById('empty-state');
  const s = document.getElementById('suggestions');
  if (e) e.hidden = true;
  if (s) s.style.display = 'none';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function appendUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="avatar user">You</div>
    <div class="msg-body"><div class="bubble">${escHtml(text)}</div></div>`;
  messagesEl.appendChild(row);
}

function addUserMsg(text) {
  hideEmpty();
  appendUserBubble(text);
  scrollBottom();
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row agent'; row.id = 'typing';
  row.innerHTML = `<div class="avatar agent">AI</div>
    <div class="msg-body"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row); scrollBottom();
}

function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

const TOOL_ICONS = {
  get_weather: `<svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 2a3.5 3.5 0 013.3 4.7A2.5 2.5 0 018.5 11h-5A2.5 2.5 0 013 7a2.5 2.5 0 01.7-1.7A3.5 3.5 0 016 2z"/></svg>`,
  calculator:  `<svg viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="1" width="10" height="10" rx="2"/><path d="M3.5 4h5M3.5 6h2M3.5 8h2M7.5 6h1v2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`,
  web_search:  `<svg viewBox="0 0 12 12" fill="currentColor"><circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 7.5L10 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`
};

function mdToHtml(text) {
  try {
    return marked.parse(text, { breaks: true, gfm: true });
  } catch {
    return escHtml(text);
  }
}

function renderParts(parts) {
  return parts.map(p => {
    if (p.type === 'text') return `<div class="bubble" data-raw="${escHtml(p.text)}">${mdToHtml(p.text)}</div>`;
    const icon = TOOL_ICONS[p.tool] || '';
    return `<div class="tool-card">
      <div class="tool-card-header">
        <div class="tool-icon ${escHtml(p.tool)}">${icon}</div>
        <div class="tool-name">${escHtml(p.tool)}</div>
      </div>
      <div class="tool-input">${escHtml(p.input)}</div>
      <div class="tool-divider"></div>
      <div class="tool-output">${escHtml(p.output)}</div>
    </div>`;
  }).join('');
}

function appendAgentParts(parts) {
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.innerHTML = `<div class="avatar agent">AI</div><div class="msg-body">${renderParts(parts)}</div>`;
  messagesEl.appendChild(row);
}

function addAgentMsg(parts) {
  removeTyping();
  appendAgentParts(parts);
  scrollBottom();
}

function addError(msg) {
  removeTyping();
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.innerHTML = `<div class="avatar agent">AI</div><div class="msg-body"><div class="error-msg">${escHtml(msg)}</div></div>`;
  messagesEl.appendChild(row); scrollBottom();
}

function scrollBottom() { setTimeout(() => messagesEl.scrollTop = messagesEl.scrollHeight, 30); }

// ── Send ─────────────────────────────────────────────────────────
let busy = false;
let firstMsgInConv = true;

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  inputEl.value = ''; inputEl.style.height = 'auto';
  const model = modelSelect.value;
  const isFirstMsg = firstMsgInConv && currentId === null;

  addUserMsg(text);
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, model })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server error');
    addAgentMsg(data.parts);

    // save / update history after each successful reply
    if (isFirstMsg) firstMsgInConv = false;
    saveCurrentConversation(text, model);
  } catch (err) {
    addError('Error: ' + err.message);
  } finally {
    busy = false;
  }
}

// reset firstMsgInConv when new chat starts
newChatBtn.addEventListener('click', () => { firstMsgInConv = true; }, true);

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});
document.querySelectorAll('.sug-btn').forEach(btn => {
  btn.addEventListener('click', () => { inputEl.value = btn.dataset.q; send(); });
});

// ── Init ─────────────────────────────────────────────────────────
renderHistory();
</script>
</body>
</html>
