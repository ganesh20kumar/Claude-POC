<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
// Apply saved theme before first paint to avoid flash
(function(){
  const t = localStorage.getItem('agent_chat_theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ── Design tokens ── */
:root {
  --bg:         #f5f5f7;
  --surface:    #ffffff;
  --surface2:   #efefef;
  --border:     #e0e0e3;
  --fg:         #111117;
  --fg2:        #5a5a6e;
  --fg3:        #8888a0;
  --accent:     #5542e8;
  --accent-dim: rgba(85,66,232,0.10);
  --user-bg:    #5542e8;
  --user-fg:    #ffffff;
  --tool-bg:    #f0eeff;
  --tool-border:#c9c1f9;
  --tool-fg:    #3b2fc7;
  --code-bg:    #1e1c2e;
  --code-fg:    #c8c3f6;
  --weather-c:  #0ea5b8;
  --calc-c:     #e88030;
  --search-c:   #2ea05a;
  --dot:        #ccccd8;
  --sidebar-w:  256px;
  --fab-shadow: 0 4px 16px rgba(0,0,0,0.12);
  color-scheme: light;
}
/* OS dark mode (when no manual override) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #0d0c14;
    --surface:    #17151f;
    --surface2:   #201e2b;
    --border:     #2c2a3a;
    --fg:         #e8e6f4;
    --fg2:        #9490b8;
    --fg3:        #5d5a7a;
    --accent:     #7b6bf0;
    --accent-dim: rgba(123,107,240,0.14);
    --user-bg:    #6355ee;
    --user-fg:    #ffffff;
    --tool-bg:    #1e1c2e;
    --tool-border:#3a3360;
    --tool-fg:    #a89cf5;
    --code-bg:    #111020;
    --code-fg:    #c8c3f6;
    --weather-c:  #22c9e0;
    --calc-c:     #f0a050;
    --search-c:   #40c870;
    --dot:        #3a3850;
    --fab-shadow: 0 4px 16px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
}
/* Manual dark override */
:root[data-theme="dark"] {
  --bg:         #0d0c14;
  --surface:    #17151f;
  --surface2:   #201e2b;
  --border:     #2c2a3a;
  --fg:         #e8e6f4;
  --fg2:        #9490b8;
  --fg3:        #5d5a7a;
  --accent:     #7b6bf0;
  --accent-dim: rgba(123,107,240,0.14);
  --user-bg:    #6355ee;
  --user-fg:    #ffffff;
  --tool-bg:    #1e1c2e;
  --tool-border:#3a3360;
  --tool-fg:    #a89cf5;
  --code-bg:    #111020;
  --code-fg:    #c8c3f6;
  --weather-c:  #22c9e0;
  --calc-c:     #f0a050;
  --search-c:   #40c870;
  --dot:        #3a3850;
  --fab-shadow: 0 4px 16px rgba(0,0,0,0.4);
  color-scheme: dark;
}
/* Manual light override */
:root[data-theme="light"] {
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  background: var(--bg); color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px; line-height: 1.55;
}

/* ── Shell layout ── */
#shell { display: flex; height: 100%; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 0.22s ease, opacity 0.22s ease;
  overflow: hidden;
}
#sidebar.collapsed { width: 0; opacity: 0; pointer-events: none; }

.sidebar-header {
  padding: 12px 12px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
}
.sidebar-title-row {
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-title {
  font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3);
}
#new-chat-btn {
  width: 100%; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--accent-dim);
  color: var(--accent); font-family: 'Sora', sans-serif; font-size: 12px;
  font-weight: 600; cursor: pointer; letter-spacing: 0.02em;
  transition: background 0.15s, color 0.15s; display: flex; align-items: center; gap: 5px; justify-content: center;
}
#new-chat-btn:hover { background: var(--accent); color: #fff; }

/* Search */
.hist-search-wrap { position: relative; padding: 8px 8px 4px; flex-shrink: 0; }
#hist-search {
  width: 100%; padding: 6px 10px 6px 30px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--fg); font-size: 12px;
  font-family: 'DM Sans', sans-serif; outline: none;
  transition: border-color 0.15s;
}
#hist-search:focus { border-color: var(--accent); }
#hist-search::placeholder { color: var(--fg3); }
.hist-search-icon {
  position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
  color: var(--fg3); pointer-events: none;
}
.hist-search-icon svg { width: 13px; height: 13px; display: block; }

/* History list */
#history-list {
  flex: 1; overflow-y: auto; padding: 4px 6px 4px;
  display: flex; flex-direction: column;
}

/* Group header */
.hist-group { margin-bottom: 2px; }
.hist-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 6px 4px; border-radius: 6px; cursor: pointer;
  user-select: none; transition: background 0.12s;
}
.hist-group-header:hover { background: var(--surface2); }
.hist-group-label {
  font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg3);
  display: flex; align-items: center; gap: 5px;
}
.hist-group-count {
  background: var(--surface2); border-radius: 10px;
  padding: 1px 6px; font-size: 10px; color: var(--fg3); font-weight: 600;
}
.hist-group-chevron {
  color: var(--fg3); transition: transform 0.2s;
  display: flex; align-items: center;
}
.hist-group-chevron svg { width: 10px; height: 10px; }
.hist-group.collapsed .hist-group-chevron { transform: rotate(-90deg); }
.hist-group-items { display: flex; flex-direction: column; gap: 1px; padding-bottom: 2px; }
.hist-group.collapsed .hist-group-items { display: none; }

/* History items */
.hist-item {
  padding: 7px 8px; border-radius: 7px; cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.12s, border-color 0.12s;
  display: flex; flex-direction: column; gap: 2px; overflow: hidden;
}
.hist-item:hover { background: var(--surface2); border-color: var(--border); }
.hist-item.active { background: var(--accent-dim); border-color: var(--accent); }
.hist-item-row { display: flex; align-items: center; gap: 4px; }
.hist-item-title {
  font-size: 12px; font-weight: 500; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.hist-del-btn {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 4px; border: none;
  background: transparent; color: var(--fg3); cursor: pointer;
  display: none; align-items: center; justify-content: center; padding: 0;
  transition: background 0.12s, color 0.12s;
}
.hist-item:hover .hist-del-btn { display: flex; }
.hist-del-btn:hover { background: rgba(192,57,43,0.14); color: #c0392b; }
.hist-del-btn svg { width: 10px; height: 10px; }
.hist-item-meta {
  font-size: 10px; color: var(--fg3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Show more */
.hist-show-more {
  padding: 5px 8px; font-size: 11px; color: var(--accent); cursor: pointer;
  border-radius: 6px; background: transparent; border: none;
  font-family: 'DM Sans', sans-serif; text-align: left;
  transition: background 0.12s; width: 100%;
}
.hist-show-more:hover { background: var(--accent-dim); }

/* Empty/no results */
.hist-empty {
  padding: 20px 10px; text-align: center;
  font-size: 12px; color: var(--fg3); line-height: 1.6;
}

/* Sidebar footer */
.sidebar-footer {
  padding: 8px 12px 10px; border-top: 1px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: flex-end;
}
#clear-all-btn {
  font-size: 11px; color: var(--fg3); background: transparent; border: none;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  padding: 4px 6px; border-radius: 5px; transition: color 0.15s, background 0.15s;
}
#clear-all-btn:hover { color: #c0392b; background: rgba(192,57,43,0.08); }
#clear-all-btn.confirming { color: #c0392b; font-weight: 600; }

/* ── Chat area ── */
#chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* ── Header ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; gap: 10px;
}
.header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
#sidebar-toggle {
  width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--fg2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}
#sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }
#sidebar-toggle svg { width: 14px; height: 14px; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.logo-mark svg { width: 17px; height: 17px; fill: #fff; }
.header-info { min-width: 0; }
.header-title { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.header-sub { font-size: 11px; color: var(--fg3); margin-top: 1px; white-space: nowrap; }

.header-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }

/* Theme toggle */
#theme-btn {
  width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--fg2); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}
#theme-btn:hover { border-color: var(--accent); color: var(--accent); }
#theme-btn svg { width: 14px; height: 14px; }

/* Model selector */
.model-select-wrap { position: relative; display: flex; align-items: center; }
#model-select {
  appearance: none; -webkit-appearance: none;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--fg2); font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 0.02em; padding: 5px 24px 5px 9px; cursor: pointer; outline: none;
  transition: border-color 0.15s, color 0.15s;
}
#model-select:hover, #model-select:focus { border-color: var(--accent); color: var(--accent); }
.model-chevron { position: absolute; right: 6px; pointer-events: none; color: var(--fg3); }
.model-chevron svg { width: 10px; height: 10px; }

/* Tool pills */
.tool-pill {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 20px;
  font-size: 10px; font-weight: 600;
  font-family: 'Sora', sans-serif; letter-spacing: 0.03em; border: 1px solid;
}
.tool-pill.weather { color: var(--weather-c); border-color: var(--weather-c); background: rgba(14,165,184,0.06); }
.tool-pill.calc    { color: var(--calc-c);    border-color: var(--calc-c);    background: rgba(232,128,48,0.06); }
.tool-pill.search  { color: var(--search-c);  border-color: var(--search-c);  background: rgba(46,160,90,0.06); }

/* ── Messages ── */
#messages {
  flex: 1; overflow-y: auto; padding: 20px 20px 10px;
  display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
}
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.msg-meta { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.msg-row.user .msg-meta { align-items: center; }
.avatar {
  width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700;
}
.avatar.agent { background: var(--accent-dim); color: var(--accent); }
.avatar.user  { background: var(--user-bg); color: var(--user-fg); }
.model-badge {
  font-size: 9px; font-family: 'Sora', sans-serif; font-weight: 600;
  letter-spacing: 0.02em; color: var(--fg3);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 4px; white-space: nowrap;
  max-width: 52px; overflow: hidden; text-overflow: ellipsis; text-align: center;
}
.msg-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 80%; }
.msg-row.user .msg-body { align-items: flex-end; }

/* Bubbles */
.bubble { padding: 11px 14px; border-radius: 14px; word-break: break-word; position: relative; }
.agent .bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; }
.user  .bubble { background: var(--user-bg); color: var(--user-fg); border-top-right-radius: 4px; }

/* bubble-wrap: copy button container */
.bubble-wrap { position: relative; }
.copy-btn {
  position: absolute; top: 6px; right: 8px;
  opacity: 0; transition: opacity 0.15s;
  border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface2); color: var(--fg3);
  cursor: pointer; font-size: 11px; padding: 2px 6px;
  font-family: 'Sora', sans-serif; font-weight: 600;
  line-height: 1.4; white-space: nowrap;
}
.bubble-wrap:hover .copy-btn { opacity: 1; }
.copy-btn.copied { color: var(--search-c); border-color: var(--search-c); }

/* Markdown inside agent bubbles */
.agent .bubble h1,.agent .bubble h2,.agent .bubble h3 {
  font-family:'Sora',sans-serif; font-weight:700; letter-spacing:-0.01em;
  margin:0.7em 0 0.3em; line-height:1.25;
}
.agent .bubble h1{font-size:1.1em}.agent .bubble h2{font-size:1.02em}.agent .bubble h3{font-size:0.96em}
.agent .bubble p { margin:0.35em 0; }
.agent .bubble p:first-child { margin-top:0; }
.agent .bubble p:last-child  { margin-bottom:0; }
.agent .bubble ul,.agent .bubble ol { margin:0.4em 0; padding-left:1.3em; }
.agent .bubble li { margin:0.15em 0; }
.agent .bubble strong { font-weight:600; }
.agent .bubble em { font-style:italic; }
.agent .bubble code {
  font-family:'JetBrains Mono',monospace; font-size:0.84em;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:4px; padding:1px 5px;
}
.agent .bubble pre {
  background:var(--code-bg); color:var(--code-fg); border-radius:8px;
  padding:10px 12px; overflow-x:auto; margin:0.5em 0;
}
.agent .bubble pre code { background:none; border:none; padding:0; font-size:0.87em; }
.agent .bubble blockquote {
  border-left:3px solid var(--accent); margin:0.4em 0;
  padding:3px 10px; color:var(--fg2);
}
.agent .bubble a { color:var(--accent); text-decoration:underline; }
.agent .bubble hr { border:none; border-top:1px solid var(--border); margin:0.6em 0; }

/* Timestamps */
.msg-ts {
  font-size: 10px; color: var(--fg3); padding: 0 4px;
  opacity: 0; transition: opacity 0.2s; pointer-events: none;
  text-align: center;
}
.msg-row:hover .msg-ts { opacity: 1; }

/* Tool card */
.tool-card {
  background: var(--tool-bg); border: 1px solid var(--tool-border);
  border-radius: 10px; font-size: 13px; width: 100%; overflow: hidden;
}
.tool-card-header {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 12px; cursor: pointer; user-select: none;
}
.tool-card-header:hover { opacity: 0.85; }
.tool-icon {
  width: 20px; height: 20px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tool-icon.get_weather { background: rgba(14,165,184,0.14); color: var(--weather-c); }
.tool-icon.calculator  { background: rgba(232,128,48,0.14);  color: var(--calc-c); }
.tool-icon.web_search  { background: rgba(46,160,90,0.14);   color: var(--search-c); }
.tool-name { font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tool-fg); flex: 1; }
.tool-preview { font-size: 12px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.tool-chevron { color: var(--fg3); transition: transform 0.2s; display: flex; }
.tool-chevron svg { width: 10px; height: 10px; }
.tool-card.expanded .tool-chevron { transform: rotate(180deg); }
.tool-body { display: none; padding: 0 12px 10px; }
.tool-card.expanded .tool-body { display: block; }
.tool-input { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 4px 7px; background: var(--code-bg); color: var(--code-fg); border-radius: 5px; overflow-x: auto; white-space: pre; margin-bottom: 6px; }
.tool-output { font-size: 13px; white-space: pre-line; line-height: 1.5; }
.tool-divider { height: 1px; background: var(--tool-border); margin: 6px 0; opacity: 0.5; }

/* Typing dots */
.typing-dots {
  display: flex; gap: 4px; align-items: center;
  padding: 13px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; border-top-left-radius: 4px; width: fit-content;
}
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
  animation: bounce 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.18s; }
.typing-dots span:nth-child(3) { animation-delay: 0.36s; }
.typing-label { font-size: 12px; color: var(--fg3); margin-left: 6px; font-family: 'Sora', sans-serif; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

/* Scroll sentinel + FAB */
#scroll-sentinel { height: 1px; flex-shrink: 0; }
#scroll-fab {
  position: absolute; bottom: 80px; right: 20px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--fab-shadow);
  opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
#scroll-fab.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
#scroll-fab svg { width: 16px; height: 16px; }

/* Input bar */
#input-bar {
  display: flex; flex-direction: column;
  padding: 10px 18px 12px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
}
.input-row { display: flex; align-items: flex-end; gap: 10px; }
#user-input {
  flex: 1; min-width: 0; resize: none;
  border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px;
  background: var(--bg); color: var(--fg); outline: none;
  max-height: 140px; overflow-y: auto; transition: border-color 0.15s;
}
#user-input:focus { border-color: var(--accent); }
#user-input::placeholder { color: var(--fg3); }
#send-btn {
  width: 40px; height: 40px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.15s;
}
#send-btn:hover { opacity: 0.88; }
#send-btn svg { width: 16px; height: 16px; }
.input-meta {
  display: flex; justify-content: flex-end;
  padding-top: 4px; padding-right: 2px;
}
#char-count { font-size: 11px; color: var(--fg3); transition: color 0.2s; }
#char-count.warn { color: var(--calc-c); }
#char-count.danger { color: #c0392b; }

/* Suggestions */
.suggestions { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 18px 10px; }
.sug-btn {
  padding: 6px 11px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); color: var(--fg2); font-size: 12px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s; font-family: 'DM Sans', sans-serif;
}
.sug-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: 60px 20px; gap: 14px; flex: 1;
}
.empty-icon {
  width: 54px; height: 54px; border-radius: 14px; background: var(--accent-dim);
  display: flex; align-items: center; justify-content: center;
  animation: pulse 3s ease-in-out infinite;
}
.empty-icon svg { width: 26px; height: 26px; fill: var(--accent); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
.empty-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.empty-sub { font-size: 14px; color: var(--fg2); max-width: 300px; line-height: 1.5; }

/* Error */
.error-msg { color: #c0392b; font-size: 13px; padding: 8px 12px; background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.2); border-radius: 8px; }

/* Mobile */
@media (max-width: 600px) {
  #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 100; width: var(--sidebar-w); }
  #sidebar.collapsed { width: 0; }
  header { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .tool-pill { display: none; }
  .msg-body { max-width: 92%; }
  #messages { padding: 16px 14px 8px; }
  .suggestions { padding: 0 14px 8px; }
  #input-bar { padding: 8px 14px 10px; }
}
</style>
</head>
<body>
<div id="shell">

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-row">
        <div class="sidebar-title">History</div>
      </div>
      <button id="new-chat-btn">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>
        New Chat
      </button>
    </div>
    <div class="hist-search-wrap">
      <span class="hist-search-icon">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="5" cy="5" r="3.5"/><line x1="7.5" y1="7.5" x2="10.5" y2="10.5"/>
        </svg>
      </span>
      <input id="hist-search" type="text" placeholder="Search conversations…" autocomplete="off">
    </div>
    <div id="history-list"></div>
    <div class="sidebar-footer">
      <button id="clear-all-btn">Clear all</button>
    </div>
  </aside>

  <!-- ── Chat area ── -->
  <div id="chat-area">
    <header>
      <div class="header-left">
        <button id="sidebar-toggle" aria-label="Toggle history">
          <!-- icon set by JS -->
        </button>
        <div class="logo-mark">
          <svg viewBox="0 0 20 20"><path d="M10 2C5.6 2 2 5.6 2 10s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8zm-1 12.4L5.6 10l1.4-1.4 2 2 5-5 1.4 1.4z"/></svg>
        </div>
        <div class="header-info">
          <div class="header-title">Agent Chat</div>
          <div class="header-sub" id="header-sub">claude-sonnet-4-6 · live</div>
        </div>
      </div>
      <div class="header-right">
        <button id="theme-btn" aria-label="Toggle theme"></button>
        <div class="model-select-wrap">
          <select id="model-select" aria-label="Select model">
            <option value="claude-sonnet-4-6">Sonnet 4.6</option>
            <option value="claude-haiku-4-5">Haiku 4.5</option>
            <option value="claude-sonnet-5-5">Sonnet 5.5</option>
            <option value="claude-opus-5-5">Opus 5.5</option>
          </select>
          <span class="model-chevron"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5l3 3 3-3"/></svg></span>
        </div>
        <div class="tool-pill weather">Weather</div>
        <div class="tool-pill calc">Calc</div>
        <div class="tool-pill search">Search</div>
      </div>
    </header>

    <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        </div>
        <div class="empty-title">Ask me anything</div>
        <div class="empty-sub">Weather, maths, or live web search — Claude picks the right tool automatically.</div>
      </div>
      <div id="scroll-sentinel"></div>
    </div>

    <button id="scroll-fab" aria-label="Scroll to bottom">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 12.7L1.3 6 2.7 4.6l5.3 5.3 5.3-5.3 1.4 1.4z"/></svg>
    </button>

    <div class="suggestions" id="suggestions">
      <button class="sug-btn" data-q="What is the weather in Mumbai right now?">🌤 Mumbai weather</button>
      <button class="sug-btn" data-q="What is 15% of 85000?">🧮 15% of 85,000</button>
      <button class="sug-btn" data-q="Is it warmer in Dubai or Singapore today?">🌍 Dubai vs Singapore</button>
      <button class="sug-btn" data-q="What is the square root of 1764?">√1764</button>
      <button class="sug-btn" data-q="Search for the latest news on AI agents">🔍 Latest AI news</button>
    </div>

    <div id="input-bar">
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="Ask about weather, maths, or anything…"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M14.7 7.3l-12-6a.75.75 0 00-1 .95l2.44 5.25-2.44 5.25a.75.75 0 001 .95l12-6a.75.75 0 000-1.4z"/></svg>
        </button>
      </div>
      <div class="input-meta"><span id="char-count"></span></div>
    </div>
  </div>
</div>

<script>
// ── Storage helpers ─────────────────────────────────────────────
const STORAGE_KEY = 'agent_chat_history';
const GROUPS_KEY  = 'hist_groups';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); } catch {}
}
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ── DOM refs ────────────────────────────────────────────────────
const messagesEl    = document.getElementById('messages');
const inputEl       = document.getElementById('user-input');
const sendBtn       = document.getElementById('send-btn');
const modelSelect   = document.getElementById('model-select');
const headerSub     = document.getElementById('header-sub');
const historyList   = document.getElementById('history-list');
const histSearch    = document.getElementById('hist-search');
const newChatBtn    = document.getElementById('new-chat-btn');
const clearAllBtn   = document.getElementById('clear-all-btn');
const sidebarEl     = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebar-toggle');
const themeBtn      = document.getElementById('theme-btn');
const scrollFab     = document.getElementById('scroll-fab');
const charCountEl   = document.getElementById('char-count');
const sentinel      = document.getElementById('scroll-sentinel');

// ── State ───────────────────────────────────────────────────────
let history      = loadHistory();
let currentId    = null;
let firstMsgInConv = true;
let sidebarOpen  = true;
let clearConfirm = false;

// ── Theme ───────────────────────────────────────────────────────
const MOON_SVG = `<svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 1a6 6 0 100 12A6 6 0 007 1zm0 1.5a4.5 4.5 0 010 9 4.5 4.5 0 010-9z" opacity=".3"/><path d="M11.5 7A4.5 4.5 0 017 11.5a4.5 4.5 0 01-1.5-.25A4 4 0 1011.75 5.5c-.08.5-.25.97-.25 1.5z"/></svg>`;
const SUN_SVG  = `<svg viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="7" r="2.8"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="7" y1="1" x2="7" y2="2.5"/><line x1="7" y1="11.5" x2="7" y2="13"/><line x1="1" y1="7" x2="2.5" y2="7"/><line x1="11.5" y1="7" x2="13" y2="7"/><line x1="2.93" y1="2.93" x2="3.99" y2="3.99"/><line x1="10.01" y1="10.01" x2="11.07" y2="11.07"/><line x1="11.07" y1="2.93" x2="10.01" y2="3.99"/><line x1="3.99" y1="10.01" x2="2.93" y2="11.07"/></g></svg>`;

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function updateThemeBtn() {
  themeBtn.innerHTML = isDark() ? SUN_SVG : MOON_SVG;
  themeBtn.title = isDark() ? 'Switch to light mode' : 'Switch to dark mode';
}
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('agent_chat_theme', next); } catch {}
  updateThemeBtn();
});
updateThemeBtn();

// ── Sidebar toggle (directional arrow) ─────────────────────────
const ICON_COLLAPSE = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2L4 7l5 5"/></svg>`;
const ICON_EXPAND   = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2l5 5-5 5"/></svg>`;

function updateToggleIcon() {
  sidebarToggle.innerHTML = sidebarOpen ? ICON_COLLAPSE : ICON_EXPAND;
}
sidebarToggle.addEventListener('click', () => {
  sidebarOpen = !sidebarOpen;
  sidebarEl.classList.toggle('collapsed', !sidebarOpen);
  updateToggleIcon();
});
updateToggleIcon();

// ── Model selector ──────────────────────────────────────────────
modelSelect.addEventListener('change', () => {
  headerSub.textContent = `${modelSelect.value} · live`;
});

// ── History grouping ────────────────────────────────────────────
function getGroup(ts) {
  const now  = new Date();
  const d    = new Date(ts);
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const diff = todayStart - new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = diff / 86400000;
  if (days < 1)  return 'Today';
  if (days < 2)  return 'Yesterday';
  if (days < 7)  return 'This week';
  if (days < 30) return 'This month';
  return 'Older';
}
const GROUP_ORDER = ['Today','Yesterday','This week','This month','Older'];

function getCollapsedGroups() {
  try { return JSON.parse(sessionStorage.getItem(GROUPS_KEY) || '{}'); } catch { return {}; }
}
function setGroupCollapsed(label, collapsed) {
  const s = getCollapsedGroups();
  s[label] = collapsed;
  try { sessionStorage.setItem(GROUPS_KEY, JSON.stringify(s)); } catch {}
}

const PAGE_SIZE = 15;
const groupExpanded = {}; // group label → how many items shown

function renderHistory() {
  const q = histSearch.value.trim().toLowerCase();
  historyList.innerHTML = '';

  // flat search mode
  if (q) {
    const matches = [...history].reverse().filter(c => c.title.toLowerCase().includes(q));
    if (!matches.length) {
      historyList.innerHTML = '<div class="hist-empty">No conversations match.</div>';
      return;
    }
    matches.forEach(conv => historyList.appendChild(buildHistItem(conv)));
    return;
  }

  if (!history.length) {
    historyList.innerHTML = '<div class="hist-empty">No conversations yet.<br>Start chatting!</div>';
    return;
  }

  // group mode
  const groups = {};
  [...history].reverse().forEach(conv => {
    const g = getGroup(conv.ts);
    if (!groups[g]) groups[g] = [];
    groups[g].push(conv);
  });

  const collapsed = getCollapsedGroups();

  GROUP_ORDER.forEach(label => {
    const items = groups[label];
    if (!items) return;

    const isCollapsed = collapsed[label] !== undefined ? collapsed[label] : (label !== 'Today');
    if (groupExpanded[label] === undefined) groupExpanded[label] = PAGE_SIZE;

    const section = document.createElement('div');
    section.className = 'hist-group' + (isCollapsed ? ' collapsed' : '');
    section.dataset.group = label;

    const hdr = document.createElement('div');
    hdr.className = 'hist-group-header';
    hdr.innerHTML = `
      <div class="hist-group-label">
        ${escHtml(label)}
        <span class="hist-group-count">${items.length}</span>
      </div>
      <span class="hist-group-chevron">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5l3 3 3-3"/></svg>
      </span>`;
    hdr.addEventListener('click', () => {
      const nowCollapsed = section.classList.toggle('collapsed');
      setGroupCollapsed(label, nowCollapsed);
    });

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'hist-group-items';

    const visible = items.slice(0, groupExpanded[label]);
    visible.forEach(conv => itemsWrap.appendChild(buildHistItem(conv)));

    if (items.length > groupExpanded[label]) {
      const more = document.createElement('button');
      more.className = 'hist-show-more';
      more.textContent = `Show ${items.length - groupExpanded[label]} more…`;
      more.addEventListener('click', e => {
        e.stopPropagation();
        groupExpanded[label] += PAGE_SIZE;
        renderHistory();
      });
      itemsWrap.appendChild(more);
    }

    section.appendChild(hdr);
    section.appendChild(itemsWrap);
    historyList.appendChild(section);
  });
}

function buildHistItem(conv) {
  const item = document.createElement('div');
  item.className = 'hist-item' + (conv.id === currentId ? ' active' : '');
  item.dataset.id = conv.id;
  const date = new Date(conv.ts);
  const dateStr = date.toLocaleDateString(undefined, { month:'short', day:'numeric' })
                + ' ' + date.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  const modelLabel = conv.model.replace('claude-','').replace(/-/g,' ');
  item.innerHTML = `
    <div class="hist-item-row">
      <div class="hist-item-title">${escHtml(conv.title)}</div>
      <button class="hist-del-btn" aria-label="Delete" title="Delete">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/>
        </svg>
      </button>
    </div>
    <div class="hist-item-meta">${escHtml(modelLabel)} · ${dateStr}</div>`;
  item.querySelector('.hist-del-btn').addEventListener('click', e => {
    e.stopPropagation();
    deleteConversation(conv.id);
  });
  item.addEventListener('click', () => loadConversation(conv.id));
  return item;
}

// ── History search ──────────────────────────────────────────────
histSearch.addEventListener('input', () => renderHistory());

// ── Clear all ───────────────────────────────────────────────────
clearAllBtn.addEventListener('click', () => {
  if (!clearConfirm) {
    clearConfirm = true;
    clearAllBtn.textContent = 'Confirm?';
    clearAllBtn.classList.add('confirming');
    setTimeout(() => {
      clearConfirm = false;
      clearAllBtn.textContent = 'Clear all';
      clearAllBtn.classList.remove('confirming');
    }, 3000);
    return;
  }
  history = [];
  saveHistory(history);
  currentId = null;
  firstMsgInConv = true;
  clearConfirm = false;
  clearAllBtn.textContent = 'Clear all';
  clearAllBtn.classList.remove('confirming');
  showEmptyState();
  renderHistory();
});

// ── Delete conversation ─────────────────────────────────────────
function deleteConversation(id) {
  history = history.filter(c => c.id !== id);
  saveHistory(history);
  if (currentId === id) { currentId = null; firstMsgInConv = true; showEmptyState(); }
  renderHistory();
}

// ── Load conversation ───────────────────────────────────────────
function loadConversation(id) {
  const conv = history.find(c => c.id === id);
  if (!conv) return;
  currentId = id;
  firstMsgInConv = false;
  messagesEl.innerHTML = '<div id="scroll-sentinel"></div>';
  document.getElementById('suggestions').style.display = 'none';
  modelSelect.value = conv.model;
  headerSub.textContent = `${conv.model} · live`;
  conv.messages.forEach(msg => {
    if (msg.role === 'user') appendUserBubble(msg.text, msg.ts);
    else appendAgentParts(msg.parts || [], msg.model);
  });
  renderHistory();
  scrollBottom();
  reattachSentinel();
}

// ── Save conversation ───────────────────────────────────────────
function saveCurrentConversation(firstUserMsg, model) {
  if (currentId) {
    const idx = history.findIndex(c => c.id === currentId);
    if (idx !== -1) {
      history[idx].messages = collectMessages();
      history[idx].model = model;
      saveHistory(history);
      renderHistory();
      return;
    }
  }
  currentId = genId();
  history.push({ id: currentId, title: firstUserMsg.slice(0,60), model, ts: Date.now(), messages: collectMessages() });
  saveHistory(history);
  renderHistory();
}

function collectMessages() {
  const msgs = [];
  messagesEl.querySelectorAll('.msg-row').forEach(row => {
    if (row.id === 'typing') return;
    const ts = Number(row.dataset.ts) || Date.now();
    if (row.classList.contains('user')) {
      const bubble = row.querySelector('.bubble');
      if (bubble) msgs.push({ role: 'user', text: bubble.textContent, ts });
    } else {
      const parts = [];
      row.querySelectorAll('.bubble-wrap').forEach(bw => {
        parts.push({ type: 'text', text: bw.querySelector('.bubble').dataset.raw || bw.querySelector('.bubble').textContent });
      });
      row.querySelectorAll('.tool-card').forEach(card => {
        parts.push({
          type: 'tool',
          tool:   card.querySelector('.tool-name')?.textContent || '',
          input:  card.querySelector('.tool-input')?.textContent || '',
          output: card.querySelector('.tool-output')?.textContent || '',
        });
      });
      if (parts.length) msgs.push({ role: 'agent', parts, model: row.dataset.model, ts });
    }
  });
  return msgs;
}

// ── Empty state ─────────────────────────────────────────────────
function showEmptyState() {
  messagesEl.innerHTML = `
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      </div>
      <div class="empty-title">Ask me anything</div>
      <div class="empty-sub">Weather, maths, or live web search — Claude picks the right tool automatically.</div>
    </div>
    <div id="scroll-sentinel"></div>`;
  document.getElementById('suggestions').style.display = '';
  reattachSentinel();
}

// ── UI helpers ──────────────────────────────────────────────────
function hideEmpty() {
  const e = document.getElementById('empty-state');
  const s = document.getElementById('suggestions');
  if (e) e.remove();
  if (s) s.style.display = 'none';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdToHtml(text) {
  try { return marked.parse(text, { breaks: true, gfm: true }); }
  catch { return escHtml(text); }
}

function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  return sameDay ? time : d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' ' + time;
}

function appendUserBubble(text, ts) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  if (ts) row.dataset.ts = ts;
  row.innerHTML = `
    <div class="msg-meta">
      <div class="avatar user">You</div>
      ${ts ? `<span class="msg-ts">${fmtTime(ts)}</span>` : ''}
    </div>
    <div class="msg-body"><div class="bubble">${escHtml(text)}</div></div>`;
  insertBeforeSentinel(row);
}

function addUserMsg(text) {
  hideEmpty();
  appendUserBubble(text, Date.now());
  scrollBottom();
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row agent'; row.id = 'typing';
  row.innerHTML = `<div class="msg-meta"><div class="avatar agent">✦</div></div>
    <div class="msg-body"><div class="typing-dots"><span></span><span></span><span></span><span class="typing-label">Thinking…</span></div></div>`;
  insertBeforeSentinel(row);
  scrollBottom();
}
function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

const TOOL_ICONS = {
  get_weather: `<svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 2a3.5 3.5 0 013.3 4.7A2.5 2.5 0 018.5 11h-5A2.5 2.5 0 013 7a2.5 2.5 0 01.7-1.7A3.5 3.5 0 016 2z"/></svg>`,
  calculator:  `<svg viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="1" width="10" height="10" rx="2"/><path d="M3.5 4h5M3.5 6h2M3.5 8h2M7.5 6h1v2" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/></svg>`,
  web_search:  `<svg viewBox="0 0 12 12" fill="currentColor"><circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 7.5L10 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`
};

function renderParts(parts, model) {
  return parts.map(p => {
    if (p.type === 'text') {
      return `<div class="bubble-wrap">
        <button class="copy-btn" data-text="${escHtml(p.text)}" title="Copy response">Copy</button>
        <div class="bubble" data-raw="${escHtml(p.text)}">${mdToHtml(p.text)}</div>
      </div>`;
    }
    const icon    = TOOL_ICONS[p.tool] || '';
    const preview = String(p.output || '').split('\n')[0].slice(0, 50);
    return `<div class="tool-card">
      <div class="tool-card-header">
        <div class="tool-icon ${escHtml(p.tool)}">${icon}</div>
        <div class="tool-name">${escHtml(p.tool)}</div>
        <div class="tool-preview">${escHtml(preview)}</div>
        <span class="tool-chevron">
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5l3 3 3-3"/></svg>
        </span>
      </div>
      <div class="tool-body">
        <div class="tool-input">${escHtml(p.input)}</div>
        <div class="tool-divider"></div>
        <div class="tool-output">${escHtml(p.output)}</div>
      </div>
    </div>`;
  }).join('');
}

function appendAgentParts(parts, model) {
  const ts  = Date.now();
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.dataset.ts = ts;
  if (model) row.dataset.model = model;
  const badgeLabel = model ? model.replace('claude-','').replace('sonnet-','').replace(/-/g,'.') : '';
  row.innerHTML = `
    <div class="msg-meta">
      <div class="avatar agent">✦</div>
      ${badgeLabel ? `<div class="model-badge" title="${escHtml(model)}">${escHtml(badgeLabel)}</div>` : ''}
      <span class="msg-ts">${fmtTime(ts)}</span>
    </div>
    <div class="msg-body">${renderParts(parts, model)}</div>`;
  // wire tool card toggles
  row.querySelectorAll('.tool-card-header').forEach(hdr => {
    hdr.addEventListener('click', () => hdr.closest('.tool-card').classList.toggle('expanded'));
  });
  // wire copy buttons
  row.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const text = btn.dataset.text;
      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
      } catch {
        btn.textContent = 'Error';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
      }
    });
  });
  insertBeforeSentinel(row);
}

function addAgentMsg(parts) {
  removeTyping();
  if (!parts || !parts.length) {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.innerHTML = `<div class="msg-meta"><div class="avatar agent">✦</div></div>
      <div class="msg-body"><div class="error-msg">No response received — please try again.</div></div>`;
    insertBeforeSentinel(row);
    scrollBottom();
    return;
  }
  appendAgentParts(parts, modelSelect.value);
  scrollBottom();
}

function addError(msg) {
  removeTyping();
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.innerHTML = `<div class="msg-meta"><div class="avatar agent">✦</div></div>
    <div class="msg-body"><div class="error-msg">${escHtml(msg)}</div></div>`;
  insertBeforeSentinel(row);
  scrollBottom();
}

function insertBeforeSentinel(el) {
  const s = document.getElementById('scroll-sentinel');
  if (s) messagesEl.insertBefore(el, s);
  else messagesEl.appendChild(el);
}

function scrollBottom() {
  setTimeout(() => messagesEl.scrollTop = messagesEl.scrollHeight, 30);
}

// ── Scroll-to-bottom FAB ────────────────────────────────────────
function reattachSentinel() {
  if (sentinelObserver) {
    const s = document.getElementById('scroll-sentinel');
    if (s) sentinelObserver.observe(s);
  }
}

let sentinelObserver = null;
function setupScrollFab() {
  sentinelObserver = new IntersectionObserver(([entry]) => {
    scrollFab.classList.toggle('visible', !entry.isIntersecting);
  }, { root: messagesEl, threshold: 0 });
  const s = document.getElementById('scroll-sentinel');
  if (s) sentinelObserver.observe(s);
}
scrollFab.addEventListener('click', () => scrollBottom());
setupScrollFab();

// ── New chat ────────────────────────────────────────────────────
newChatBtn.addEventListener('click', () => {
  currentId = null;
  firstMsgInConv = true;
  showEmptyState();
  renderHistory();
}, true);

// ── Character counter ───────────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  const len = inputEl.value.length;
  if (len === 0) { charCountEl.textContent = ''; charCountEl.className = ''; return; }
  charCountEl.textContent = len + ' chars';
  charCountEl.className = len > 3000 ? 'danger' : len > 1000 ? 'warn' : '';
});

// ── Conversation memory ─────────────────────────────────────────
function buildApiHistory() {
  if (!currentId) return [];
  const conv = history.find(c => c.id === currentId);
  if (!conv) return [];
  const pairs = [];
  for (const msg of conv.messages) {
    if (msg.role === 'user') {
      pairs.push({ role: 'user', content: msg.text });
    } else {
      const text = (msg.parts || [])
        .filter(p => p.type === 'text')
        .map(p => p.text)
        .join('\n\n');
      if (text) pairs.push({ role: 'assistant', content: text });
    }
  }
  return pairs.slice(-20); // keep last 20 turns to stay within token budget
}

// ── Send ────────────────────────────────────────────────────────
let busy = false;

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  inputEl.value = ''; inputEl.style.height = 'auto';
  charCountEl.textContent = '';
  const model = modelSelect.value;
  const isFirstMsg = firstMsgInConv && currentId === null;

  addUserMsg(text);
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, model, history: buildApiHistory() })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server error');
    addAgentMsg(data.parts);
    if (isFirstMsg) firstMsgInConv = false;
    saveCurrentConversation(text, model);
  } catch (err) {
    addError('Error: ' + err.message);
  } finally {
    busy = false;
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.querySelectorAll('.sug-btn').forEach(btn => {
  btn.addEventListener('click', () => { inputEl.value = btn.dataset.q; send(); });
});

// ── Init ────────────────────────────────────────────────────────
renderHistory();
</script>
</body>
</html>
